<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Adipura Archery Community">
  <!-- Logo SEMENTARA (menyerupai logo asli Adipura Archery). -->
  <!-- Ganti file ini dengan logo asli begitu tersedia. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9fb"/>
      <stop offset="1" stop-color="#5cb8e6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ac74f"/>
      <stop offset="1" stop-color="#3f9b46"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="50" cy="50" r="42"/></clipPath>
  </defs>

  <!-- lingkaran utama -->
  <circle cx="50" cy="50" r="47" fill="#F6F3EE"/>
  <circle cx="50" cy="50" r="42" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <!-- gunung -->
    <polygon points="6,74 34,34 52,60 40,74" fill="url(#hill)"/>
    <polygon points="34,34 40,42 46,34 40,26" fill="#eafff0" opacity="0.85"/>
    <polygon points="44,74 70,40 96,74" fill="url(#hill)"/>
    <polygon points="70,40 75,47 80,40 75,33" fill="#eafff0" opacity="0.85"/>
    <!-- busur (bow) di bawah -->
    <path d="M18 78 Q50 96 82 78" fill="none" stroke="#123A5E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sun/nock hitam -->
  <circle cx="34" cy="48" r="8" fill="#20242B"/>

  <!-- panah menembus ke kanan -->
  <g stroke="#20242B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="30" y1="48" x2="86" y2="48"/>
    <polyline points="78,42 86,48 78,54"/>
  </g>

  <!-- aksen pita merah kanan (khas logo) -->
  <path d="M50 8 A42 42 0 0 1 88 62" fill="none" stroke="#D6322E" stroke-width="7" stroke-linecap="round"/>
</svg>
