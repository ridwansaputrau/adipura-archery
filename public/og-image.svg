<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Adipura Archery Community">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A5E"/>
      <stop offset="1" stop-color="#20242B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="220" fill="#F5A623" opacity="0.18"/>
  <circle cx="120" cy="560" r="200" fill="#D6322E" opacity="0.14"/>

  <!-- emblem -->
  <g transform="translate(120,190) scale(2.6)">
    <circle cx="50" cy="50" r="47" fill="#F6F3EE"/>
    <circle cx="50" cy="50" r="42" fill="#7ec9ec"/>
    <polygon points="10,74 36,38 54,60 42,74" fill="#4aa74b"/>
