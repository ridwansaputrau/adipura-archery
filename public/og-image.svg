  <text x="470" y="250" font-family="Poppins, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Adipura Archery</text>
  <text x="472" y="315" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFB84D" letter-spacing="6">COMMUNITY · BANDUNG</text>
