  <text x="472" y="452" font-family="Inter, Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.7">Klub &amp; komunitas panahan · Latihan semua usia</text>

  <rect x="472" y="500" width="330" height="66" rx="33" fill="#F5A623"/>
  <text x="637" y="542" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#20242B">Hubungi via WhatsApp</text>
